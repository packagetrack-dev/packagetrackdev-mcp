[project]
name = "packagetrackdev-mcp"
version = "0.1.0"
description = "PackageTrack MCP server: what a dependency changed since you locked it, for your coding agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fatih Melih Ersoy" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "mcp>=2,<3",
]
keywords = ["mcp", "mcp-server", "dependencies", "changelog", "release-notes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://packagetrack.dev"
Repository = "https://github.com/packagetrack-dev/packagetrackdev-mcp"
Issues = "https://github.com/packagetrack-dev/packagetrackdev-mcp/issues"

[project.scripts]
packagetrackdev-mcp = "packagetrackdev_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packagetrackdev_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
